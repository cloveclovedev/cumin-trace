 font-size="14" lengthAdjust="spacing" textLength="257.4004" x="186.3" y="247.4789">issue models, repository from origin,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="217.875" x="186.3" y="263.7757">progress, discrepancies (pure),</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="232.2373" x="186.3" y="280.0726">export keys first, then trace keys</text></g><!--entity requirement--><g class="entity" data-entity="requirement" data-source-line="11" data-uid="ent0006" id="entity_requirement"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="257.542" x="22.23" y="401.5269"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="237.542" x="32.23" y="424.522">read the requirement documents,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221.0879" x="32.23" y="440.8189">ListedIDs (IDs of an issue body)</text></g><!--entity export--><g class="entity" data-entity="export" data-source-line="15" data-uid="ent0008" id="entity_export"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="227.9697" x="336.02" y="393.3769"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.334" x="346.02" y="416.372">domain.go</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="207.9697" x="346.02" y="432.6689">Of (keys of one requirement),</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="170.29" x="346.02" y="448.9657">Sort (order of the areas)</text></g><g class="entity" data-entity="GMN12" data-source-line="23" data-uid="ent0013" id="entity_GMN12"><path d="M489.08,223.0869 L489.08,246.7869 L454.02,250.7869 L489.08,254.7869 L489.08,278.4853 A0