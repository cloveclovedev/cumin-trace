<svg xmlns="http://www.w3.org/2000/svg" width="600" height="428" viewBox="0 0 600 428" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="20" y="30" font-size="16" font-weight="bold">dashboard page (site/src/pages/dashboard.astro)</text><rect x="20" y="50" width="560" height="48" rx="6" fill="#F4F4F4" stroke="#888" stroke-width="1"/><text x="34" y="79" font-size="14" fill="#333" font-weight="normal">Requirements dashboard | read from GitHub at &lt;time&gt;</text><rect x="20" y="108" width="560" height="48" rx="6" fill="#FDECEC" stroke="#D62728" stroke-width="4"/><text x="34" y="137" font-size="14" fill="#D62728" font-weight="bold">Filter: milestone, progress</text><rect x="20" y="166" width="560" height="48" rx="6" fill="#F4F4F4" stroke="#888" stroke-width="1"/><text x="34" y="195" font-size="14" fill="#333" font-weight="normal">Summary: not filed, in progress / done per milestone</text><rect x="20" y="224" width="560" height="48" rx="6" fill="#F4F4F4" stroke="#888" stroke-width="1"/><text x="34" y="253" font-size="14" fill="#333" font-weight="normal">File next: requirements with no requirement issue</text><rect x="20" y="282" width="560" height="48" rx="6" fill="#F4F4F4" stroke="#888" stroke-width="1"/><text x="34" y="311" font-size="14" fill="#333" font-weight="normal">Discrepancies: kind, requirement issue, ID</text><rect x="20" y="340" width="560" height="48" rx="6" fill="#F4F4F4" stroke="#888" stroke-width="1"/><text x="34" y="369" font-size="14" fill="#333" font-weight="normal">Requirement tree: area &gt; requirement &gt; child, progress, issues, links</text><text x="20" y="414" font-size="13" fill="#D62728">This issue adds the filter of the tree in the browser.</text></svg>
