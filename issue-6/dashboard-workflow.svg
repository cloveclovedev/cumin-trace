<svg xmlns="http://www.w3.org/2000/svg" width="600" height="416" viewBox="0 0 600 416" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="20" y="20" width="560" height="48" rx="6" fill="#FDECEC" stroke="#D62728" stroke-width="4"/><text x="34" y="49" font-size="14" fill="#D62728" font-weight="bold">GitHub Actions (push to main, schedule) or own machine</text><line x1="300" y1="68" x2="300" y2="94" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="98" width="560" height="48" rx="6" fill="#F4F4F4" stroke="#888" stroke-width="1"/><text x="34" y="127" font-size="14" fill="#333" font-weight="normal">cumin-trace trace &gt; site/trace.json (missing when GitHub cannot be read)</text><line x1="300" y1="146" x2="300" y2="172" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="176" width="560" height="48" rx="6" fill="#F4F4F4" stroke="#888" stroke-width="1"/><text x="34" y="205" font-size="14" fill="#333" font-weight="normal">Starlight build (npm --prefix site run build)</text><line x1="300" y1="224" x2="300" y2="250" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="254" width="560" height="48" rx="6" fill="#F4F4F4" stroke="#888" stroke-width="1"/><text x="34" y="283" font-size="14" fill="#333" font-weight="normal">dashboard page: read time, summary, lists, tree</text><line x1="300" y1="302" x2="300" y2="328" stroke="#555" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="332" width="560" height="48" rx="6" fill="#F4F4F4" stroke="#888" stroke-width="1"/><text x="34" y="361" font-size="14" fill="#333" font-weight="normal">static site: documents + dashboard</text><text x="20" y="402" font-size="13" fill="#D62728">This issue adds the example workflow; it builds and does not publish.</text></svg>
