# The settings of cumin-trace for the requirement documents of this repository
prefix = "CTR"

# The allowed areas, in the order of docs/ja/requirements/index.md
areas = ["FMT", "TPL", "CHK", "EXP", "TRC", "SITE", "DASH", "CMD"]

# The site of the documents of this repository, on GitHub Pages under /cumin-trace/
[site]
name = "cumin-trace"
base = "/cumin-trace/"
